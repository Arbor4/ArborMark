[package]
name = "arbormark"
version = "4.0.3"
description = "ArborMark - a lightweight, modern Markdown editor"
authors = ["ArborMark Team <Arbor4@users.noreply.github.com>"]
license = "GPL-3.0-or-later"
edition = "2021"
rust-version = "1.77"

[[bin]]
# 可执行文件名决定 macOS Dock（未打包运行时）显示的名字；
# 用 package 名会让 Dock 显示小写 "arbormark"。
name = "ArborMark"
path = "src/main.rs"

[lib]
name = "arbormark_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "devtools"] }
tauri-plugin-dialog = "2"
# 文件拖出到访达/其他 App（macOS 原生 NSDraggingSession；其他平台不启用）
tauri-plugin-drag = "2"
# 仅调试构建注册；release 不启用（见 lib.rs 的 with_mcp_bridge）。
tauri-plugin-mcp-bridge = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
log = "0.4"
env_logger = "0.11"
uuid = { version = "1", features = ["v4"] }
open = "5"
arboard = { version = "3", features = ["image-data"] }
dirs = "5"
trash = "5"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
notify = "7"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.60", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_System_LibraryLoader", "Win32_System_DataExchange", "Win32_System_Ole", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_UI_Shell_Common"] }
# PDF 导出要靠 WebView2 的 `ICoreWebView2_7::PrintToPdf`（Tauri 没有等价 API）。
# 版本必须和 tauri/wry 解析出的完全一致，否则 `PlatformWebview::controller()`
# 返回的 COM 接口类型对不上，`cast()` 会编译失败。
# `StructuredStorage` 提供 CreateStreamOnHGlobal / IStream（WebView2 的截图要写进
# 一个 COM 流），`Memory` 提供 GlobalLock 把流里的字节取出来。
windows = { version = "0.62", features = ["Win32_System_Com_StructuredStorage", "Win32_System_Memory"] }
webview2-com = "0.39"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString", "NSData", "NSError", "NSDictionary", "NSGeometry"] }
objc2-web-kit = { version = "0.3", features = ["WKWebView", "WKSnapshotConfiguration", "WKPDFConfiguration"] }
objc2-app-kit = { version = "0.3", features = ["NSImage", "NSBitmapImageRep"] }
block2 = "0.6"
# 三指拖动时 WebView 不上报 mousemove/mouseup 坐标，需要同步读取系统光标。
core-graphics = "0.25"

